services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=tessera'
      - 'POSTGRES_USER=tessera'
      - 'POSTGRES_PASSWORD=tessera'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tessera']
      interval: 5s
      timeout: 5s
      retries: 5
