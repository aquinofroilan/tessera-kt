services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=loom'
      - 'POSTGRES_USER=loom'
      - 'POSTGRES_PASSWORD=loom'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loom']
      interval: 5s
      timeout: 5s
      retries: 5
