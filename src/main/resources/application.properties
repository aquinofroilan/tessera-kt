# Application Configuration
spring.application.name=${APP_NAME:synectix}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}


# PostgreSQL / JPA Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loom}
spring.datasource.username=${DATABASE_USERNAME:loom}
spring.datasource.password=${DATABASE_PASSWORD:loom}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is canonical in Flyway, not in JPA. We do NOT run Hibernate's
# schema validator (validate) because the project uses native PG types
# (uuid columns + a varchar→uuid implicit cast, char(3) currency PKs)
# that Hibernate's reflection-based validator flags as mismatches even
# though they work at query time. Drift would show up as a SQL error
# on the first failing query, not silently.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Don't auto-discover compose.yaml at app boot — DataSource is driven by
# DATABASE_URL env / application.properties. Devs that want compose
# integration can re-enable via -Dspring.docker.compose.enabled=true.
spring.docker.compose.enabled=false

# Actuator configuration for health endpoints
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Security Configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
security.invitation.expiration-hours=${INVITATION_EXPIRATION_HOURS:72}
security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:60}

# Proxy / forwarded headers (set to "framework" when behind a reverse proxy)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Custom application info
info.app.name=${APP_NAME:Synectix ERP System}
info.app.description=${APP_DESCRIPTION:Synectix an ERP System}
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}
info.app.environment=${APP_ENVIRONMENT:development}

# Logging configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.loom.synectix=${LOG_LEVEL_SYNECTIX:INFO}
logging.level.com.loom.synectix.aspect=${LOG_LEVEL_ASPECT:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.flywaydb=${LOG_LEVEL_FLYWAY:INFO}

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# PostHog Configuration
posthog.enabled=${POSTHOG_ENABLED:false}
posthog.api-key=${POSTHOG_API_KEY:}
posthog.host=${POSTHOG_HOST:https://us.i.posthog.com}
posthog.distinct-id=${POSTHOG_DISTINCT_ID:synectix-backend}
posthog.logging-enabled=${POSTHOG_LOGGING_ENABLED:true}

# Log file configuration
logging.file.name=logs/synectix.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/kotlin

# FX auto-fetch (Frankfurter, ECB-sourced rates published ~16:00 CET on weekdays)
synectix.fx.auto-fetch.enabled=${FX_AUTO_FETCH_ENABLED:true}
synectix.fx.auto-fetch.cron=${FX_AUTO_FETCH_CRON:0 0 17 * * MON-FRI}
synectix.fx.auto-fetch.base-url=${FX_AUTO_FETCH_BASE_URL:https://api.frankfurter.dev/v1}
