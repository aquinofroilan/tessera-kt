# Test Application Configuration
spring.application.name=${APP_NAME:synectix-test}

# Test MongoDB configuration (using embedded MongoDB via flapdoodle)
# The embedded MongoDB will be automatically started and configured
de.flapdoodle.mongodb.embedded.version=7.0.14

# Override database configuration for tests
spring.data.mongodb.uri=${TEST_MONGODB_URI:}
spring.data.mongodb.database=${TEST_MONGODB_DATABASE:synectix-test}

# Enhanced logging for testing
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.froilan.synectix=${LOG_LEVEL_SYNECTIX:DEBUG}
logging.level.com.froilan.synectix.aspect=${LOG_LEVEL_ASPECT:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOG_LEVEL_MONGODB:DEBUG}

# Console logging pattern for tests
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
