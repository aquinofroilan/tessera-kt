# Test Application Configuration
spring.application.name=${APP_NAME:tessera-test}

# Test PostgreSQL / JPA Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:testpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=tessera_test_mfg

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true
spring.flyway.default-schema=tessera_test_mfg
spring.flyway.clean-disabled=false

spring.docker.compose.enabled=false

# Enhanced logging for testing
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.aquinofroilan.tessera=${LOG_LEVEL_TESSERA:DEBUG}
logging.level.com.aquinofroilan.tessera.aspect=${LOG_LEVEL_ASPECT:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.flywaydb=${LOG_LEVEL_FLYWAY:INFO}

# Console logging pattern for tests
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Disable FX auto-fetch scheduled job in tests
tessera.fx.auto-fetch.enabled=false
