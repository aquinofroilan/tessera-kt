# Test Application Configuration
spring.application.name=${APP_NAME:loom-test}

# Test PostgreSQL / JPA Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loom_test}
spring.datasource.username=${DATABASE_USERNAME:loom}
spring.datasource.password=${DATABASE_PASSWORD:loom}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.docker.compose.enabled=false

# Enhanced logging for testing
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.froilan.synectix=${LOG_LEVEL_SYNECTIX:DEBUG}
logging.level.com.froilan.synectix.aspect=${LOG_LEVEL_ASPECT:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.flywaydb=${LOG_LEVEL_FLYWAY:INFO}

# Console logging pattern for tests
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Disable FX auto-fetch scheduled job in tests
synectix.fx.auto-fetch.enabled=false
