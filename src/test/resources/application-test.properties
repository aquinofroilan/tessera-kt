# Test Application Configuration
spring.application.name=${APP_NAME:synectix-test}

# Test MongoDB configuration
# Option 1: Use actual MongoDB with test database (recommended for integration tests)
# Option 2: Use embedded MongoDB (set TEST_USE_EMBEDDED_MONGO=true)

# Use actual MongoDB with synectix-test database
# Takes MONGODB_URI from environment and replaces database name with synectix-test
spring.data.mongodb.uri=${TEST_MONGODB_URI:mongodb://froilancious:8ho%2A1wM%26g30J9SZw@127.0.0.1:27017/synectix-test?authSource=admin}

# Disable embedded MongoDB auto-configuration — tests use the real MongoDB URI above
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

# Enhanced logging for testing
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.froilan.synectix=${LOG_LEVEL_SYNECTIX:DEBUG}
logging.level.com.froilan.synectix.aspect=${LOG_LEVEL_ASPECT:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOG_LEVEL_MONGODB:DEBUG}

# Console logging pattern for tests
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
