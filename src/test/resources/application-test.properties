spring.application.name=synectix-test

# Test MongoDB configuration (using embedded MongoDB via flapdoodle)
# The embedded MongoDB will be automatically started and configured
de.flapdoodle.mongodb.embedded.version=7.0.14

# Enhanced logging for testing
logging.level.com.froilan.synectix=DEBUG
logging.level.com.froilan.synectix.aspect=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Console logging pattern for tests
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
