name: CI Pipeline

on:
  push:
    branches: [ production, staging ]
  pull_request:
    branches: [ production, staging ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: tessera_test
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
        options: >-
          --health-cmd "pg_isready -U tessera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin Linter
        run: ./gradlew ktlintCheck

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Run Tests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/tessera_test?currentSchema=tessera_test
          DATABASE_USERNAME: tessera
          DATABASE_PASSWORD: tessera
          JWT_SECRET: test-secret-key-for-ci-cd
        run: ./gradlew test

      - name: Start Application and Health Check
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/tessera_test?currentSchema=tessera_test
          DATABASE_USERNAME: tessera
          DATABASE_PASSWORD: tessera
          JWT_SECRET: test-secret-key-for-ci-cd
        run: |
          ./gradlew bootJar
          java -jar build/libs/*.jar > app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          echo "Application started with PID: $APP_PID"

          echo "Waiting for application to start..."
          for i in {1..30}; do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Application process died. Logs:"
              cat app.log
              exit 1
            fi
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Application is up!"
              break
            fi
            echo "Attempt $i: Application not ready yet..."
            sleep 2
          done

          echo "Testing health endpoint..."
          HEALTH_RESPONSE=$(curl -sf http://localhost:8080/api/health)
          echo "Health response: $HEALTH_RESPONSE"

          if echo "$HEALTH_RESPONSE" | grep -q '"status":"UP"'; then
            echo "Health check passed!"
          else
            echo "Health check failed. Logs:"
            cat app.log
            exit 1
          fi

      - name: Stop Application
        if: always()
        run: |
          if [ ! -z "$APP_PID" ]; then
            echo "Stopping application (PID: $APP_PID)..."
            kill $APP_PID || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 7
